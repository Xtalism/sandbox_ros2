# MoveIt uses this configuration for controller management.
# manipulator_controller is spawned by this package's launch file against the
# single controller_manager that gz_ros2_control starts for the whole robot;
# its joints are declared in config/omni_manipulator_controllers.yaml.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - manipulator_controller

  manipulator_controller:
    type: FollowJointTrajectory
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
      - arm_joint_5
    action_ns: follow_joint_trajectory
    default: true
