# Joint angles the arm is spawned at on the mobile base, in radians.
#
# Keys are UNPREFIXED (joint_1..joint_5); the robot xacro applies the arm_
# prefix when it instantiates the macro, so this file is drop-in compatible
# with manipulator_description's own copy.
#
# Limits from the arm's URDF, for reference when picking a stow pose:
#   joint_1  -1.5708 .. 1.5708     joint_4  -0.7    .. 1.5708
#   joint_2  -0.18   .. 1.5708     joint_5  -1.5708 .. 1.5708
#   joint_3  -0.9    .. 1.5708
#
# At all-zeros the arm reaches to x=+0.2185 in base_link, which is outside
# nav2's footprint (x max 0.17) - the planner would not know the arm is there.
initial_positions:
  joint_1: 0.0
  joint_2: -0.17
  joint_3: -0.89
  joint_4: -0.69
  joint_5: 0.0
