scan_to_scan_filter_chain:
  ros__parameters:
    filter1:
      name: self_mast_sector
      type: laser_filters/LaserScanSectorFilter
      params:
        # Measured empirically from a live /scan_raw sample: the camera
        # mast occludes the lidar from 162deg-198deg (2.827-3.456 rad)
        # in the sensor's own frame, with self-hit ranges of 0.02-0.058m.
        # Margin added on both sides for mounting tolerance.
        angle_min: 2.705
        angle_max: 3.578
        range_min: 0.0
        range_max: 0.15
        clear_inside: true
        invert: false
